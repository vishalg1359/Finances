<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#0f1012">
<title>Finances</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>Finances</h1>
  <p class="muted">Enter your password to load your accounts.</p>
  <input id="login-url" type="url" placeholder="Server URL" autocomplete="off">
  <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login-btn" class="btn primary">Unlock</button>
  <p id="login-err" class="err"></p>
</div>
<main id="main" hidden>
  <header class="top">
    <div class="toprow"><h1 id="title">Overview</h1>
      <div class="actions"><button id="sync-btn" class="ibtn" aria-label="Refresh">↻</button><button id="gear-btn" class="ibtn" aria-label="Settings">⚙</button></div></div>
    <div id="conns" class="chips"></div>
  </header>
  <section id="view" class="view"></section>
</main>
<nav class="tabbar" id="tabbar" hidden>
  <button class="tab active" data-view="overview"><span class="ti">◎</span>Overview</button>
  <button class="tab" data-view="categories"><span class="ti">◔</span>Categories</button>
  <button class="tab" data-view="merchants"><span class="ti">⌂</span>Merchants</button>
  <button class="tab" data-view="paidwith"><span class="ti">▭</span>Paid with</button>
  <button class="tab" data-view="cashflow"><span class="ti">⇅</span>Cash flow</button>
</nav>
<div id="panel" class="panel" hidden><header class="ptop"><button id="panel-back" class="back">‹ Back</button><h2 id="panel-title"></h2></header><div id="panel-body" class="pbody"></div></div>
<div id="overlay" class="overlay" hidden><div class="spinner"></div><p id="overlay-text"></p></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
