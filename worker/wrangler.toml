name = "finances"
main = "src/index.js"
compatibility_date = "2024-10-01"

# Daily sync so balances and net-worth history keep updating even when the app is closed.
[triggers]
crons = ["0 11 * * *"]

[vars]
PLAID_ENV = "sandbox"
ALLOWED_ORIGINS = "https://vishalg1359.github.io,http://localhost:8766"

# Created with `wrangler kv namespace create FIN`; the id is filled in at deploy time.
[[kv_namespaces]]
binding = "FIN"
id = "REPLACE_WITH_KV_ID"
